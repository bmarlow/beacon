---
apiVersion: beacon.io/v1alpha1
kind: GatewayHealthPolicy
metadata:
  # The operator loads a singleton policy named "cluster" by default
  # (configurable via the --policy-name flag).
  name: cluster
spec:
  # Wait 5s of continuous unhealthiness before withdrawing a route.
  withdrawAfter: 5s
  # Wait 30s of continuous health before restoring a route.
  readvertiseAfter: 30s
  # Worst-case reconcile cadence when no watch event fires.
  resyncInterval: 10s
  # Minimum percent of a Gateway's counted backend services that must be healthy
  # for the Gateway to stay advertised (inclusive). 100 (default) = any counted
  # backend down withdraws the route. Lower to tolerate partial outages, e.g. 50
  # keeps a 4-backend Gateway up until 3 are down. Override per-Gateway with the
  # beacon.io/min-healthy-percent annotation.
  minHealthyBackendPercent: 100
  # Per-Service pod-health threshold: minimum % of a backend Service's probed
  # pods that must be Ready for that Service to count as healthy. Default 1 = a
  # single Ready pod keeps the Service (and Gateway) up. Set 100 to require all
  # pods. Override per-Gateway or per-Service with the
  # beacon.io/min-healthy-pod-percent annotation (Service > Gateway > this).
  minHealthyPodPercent: 1
  # Set true to observe-only (no MetalLB mutations); useful for maintenance.
  paused: false

  metallb:
    # Namespace whose IPAddressPools are read to attribute Gateway VIPs to
    # MetalLB. Beacon does not modify MetalLB CRs.
    namespace: metallb-system

  # Only manage Gateways using these classes. Omit to manage all classes.
  # gatewayClassNames:
  #   - istio
  #   - openshift-default

  # Gateways to exclude from health checking (in addition to any carrying the
  # annotation  beacon.io/exempt: "true").
  exemptions:
    - namespace: infra
      name: management-gateway
