# Deploy overlay targeting the "beacon" namespace on the testcluster.
#
#   kubectl apply -k config/deploy-testcluster
#
# This reuses the base resources but overrides the namespace to "beacon" and
# points the image at GitHub Container Registry (ghcr.io), which is built and
# published automatically by the build-image GitHub Actions workflow on every
# push to main. For reproducible rollouts, replace newTag with an immutable
# commit tag published by the workflow, e.g. "sha-<short>".
namespace: beacon

resources:
  - ../crd
  - ../rbac
  - ../manager

images:
  - name: ghcr.io/bmarlow/beacon
    newName: ghcr.io/bmarlow/beacon
    newTag: "latest"

# Ensure the Namespace object itself is named "beacon" (the base manager.yaml
# creates a "beacon-system" Namespace; we patch it to "beacon").
patches:
  - target:
      kind: Namespace
      name: beacon-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: beacon
