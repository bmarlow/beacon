# Deploy overlay targeting the "beacon" namespace on the testcluster.
#
#   kubectl apply -k config/deploy-testcluster
#
# This reuses the base resources but overrides the namespace to "beacon" and
# pins the image to the pushed Quay tag.
namespace: beacon

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../dashboard

images:
  - name: quay.io/bmarlow/beacon
    newName: quay.io/bmarlow/beacon
    newTag: "0.1.3"

# Ensure the Namespace object itself is named "beacon" (the base manager.yaml
# creates a "beacon-system" Namespace; we patch it to "beacon").
patches:
  - target:
      kind: Namespace
      name: beacon-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: beacon
