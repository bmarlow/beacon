name: verify

# Fast correctness gate: build, vet, gofmt, unit tests, and a check that the
# OLM bundle CRD has not drifted from the canonical config/crd/bases copy.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Verify bundle CRD is in sync with config/crd/bases
        run: make verify-bundle-crd
