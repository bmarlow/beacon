---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: gatewayhealthpolicies.beacon.io
spec:
  group: beacon.io
  names:
    kind: GatewayHealthPolicy
    listKind: GatewayHealthPolicyList
    plural: gatewayhealthpolicies
    shortNames:
    - ghp
    singular: gatewayhealthpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.managedGateways
      name: Managed
      type: integer
    - jsonPath: .status.advertisedIPs
      name: Advertised
      type: integer
    - jsonPath: .status.withdrawnIPs
      name: Withdrawn
      type: integer
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GatewayHealthPolicy is the Schema for the gatewayhealthpolicies API.
          It is a cluster-scoped singleton (conventionally named "cluster") that
          configures Beacon's reconciliation behavior.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GatewayHealthPolicySpec defines the desired state of GatewayHealthPolicy.

              GatewayHealthPolicy is a cluster-scoped, singleton configuration resource that
              controls how Beacon reconciles Gateway API Gateways against MetalLB BGP
              advertisements. Global timers, MetalLB integration settings, and exemptions
              are all defined here. Per-Gateway annotations may override selected fields.
            properties:
              clusterName:
                description: |-
                  ClusterName optionally overrides the human-readable cluster name Beacon
                  reports about itself in status.cluster.name. Intended for multi-cluster
                  fleets where a hub cluster aggregates status from many Beacon instances
                  (e.g. one running on each cluster managed by Red Hat Advanced Cluster
                  Management). When unset, Beacon derives a name from the OpenShift
                  Infrastructure resource (status.infrastructureName) if available.
                type: string
              exemptions:
                description: |-
                  Exemptions lists Gateways that should be excluded from health checking.
                  A Gateway is also exempt if it carries the
                  "beacon.io/exempt: \"true\"" annotation.
                items:
                  description: GatewayReference identifies a Gateway by namespace
                    and name.
                  properties:
                    name:
                      description: Name of the Gateway.
                      type: string
                    namespace:
                      description: Namespace of the Gateway.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              gatewayClassNames:
                description: |-
                  GatewayClassNames optionally restricts Beacon to only manage Gateways
                  whose spec.gatewayClassName is in this list. When empty, all Gateways
                  are considered (subject to exemptions).
                items:
                  type: string
                type: array
              metallb:
                description: MetalLB configures how Beacon interacts with MetalLB
                  advertisements.
                properties:
                  namespace:
                    default: metallb-system
                    description: Namespace is the namespace in which MetalLB CRs (IPAddressPool)
                      live.
                    type: string
                type: object
              minHealthyBackendPercent:
                default: 100
                description: "MinHealthyBackendPercent is the minimum percentage of
                  a Gateway's counted\nbackend services that must be healthy for the
                  Gateway to remain\nadvertised. It is evaluated inclusively: the
                  Gateway stays up while\n\n\t(healthy backends / counted backends)
                  * 100 >= MinHealthyBackendPercent\n\nand is withdrawn when it drops
                  below. \"Counted\" backends are those with a\nhealth signal — services
                  with probed pods, or Skupper-linked services;\nprobe-less/exempt
                  services are excluded from the ratio.\n\nThe default is 100, meaning
                  any single counted backend going down\nwithdraws the Gateway. Lower
                  it to tolerate partial backend outages —\ne.g. 50 keeps a 4-backend
                  Gateway up until 3 are down (2 up = 50% is\nstill >= 50). May be
                  overridden per-Gateway with the\n\"beacon.io/min-healthy-percent\"
                  annotation."
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              minHealthyPodPercent:
                default: 1
                description: "MinHealthyPodPercent is the minimum percentage of a
                  backend Service's\nprobed pods that must be Ready for that Service
                  to count as healthy. It is\nevaluated inclusively: a Service is
                  up while\n\n\t(ready probed pods / probed pods) * 100 >= MinHealthyPodPercent\n\nThe
                  default is 1, meaning a single Ready pod keeps the Service (and
                  thus\nthe Gateway) up. Set 100 to require all pods Ready, or e.g.
                  50 to require\nat least half. Probe-less pods are ignored (a Service
                  with no probed pods\nis exempt).\n\nThis is the per-Service level
                  of the health decision; the resulting\nper-Service verdicts then
                  feed MinHealthyBackendPercent at the Gateway\nlevel. May be overridden
                  per-Gateway with the\n\"beacon.io/min-healthy-pod-percent\" annotation,
                  and per-Service with the\nsame annotation on the backend Service
                  (Service > Gateway > this default)."
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              paused:
                default: false
                description: |-
                  Paused, when true, disables all withdrawal/re-advertisement actions.
                  Beacon continues to observe and report status but takes no mutating
                  action against MetalLB. Useful for maintenance windows.
                type: boolean
              readvertiseAfter:
                default: 30s
                description: |-
                  ReadvertiseAfter is the duration a Gateway's backing workload must be
                  continuously healthy again before its IP advertisement is restored in
                  MetalLB. This dampening timer prevents route flap on intermittently
                  healthy workloads.
                type: string
              resyncInterval:
                default: 10s
                description: |-
                  ResyncInterval is the maximum period between full reconciliations of a
                  Gateway even when no watch event has fired. It bounds how quickly probe
                  state transitions are detected in the worst case.
                type: string
              withdrawAfter:
                default: 5s
                description: |-
                  WithdrawAfter is the duration a Gateway's backing workload must be
                  continuously unhealthy before its IP advertisement is withdrawn from
                  MetalLB. This acts as a dampening timer to avoid flapping.
                type: string
              zeroReplicasPolicy:
                default: Unhealthy
                description: |-
                  ZeroReplicasPolicy controls how a backend Service that is "scaled to zero"
                  is treated. A Service is considered scaled to zero when it has a pod
                  selector (i.e. it is meant to have pods) but currently has zero probed
                  pods.

                    - "Unhealthy" (default): the Service counts as a failing backend, so it
                      lowers the healthy-backend ratio and can cause the Gateway's VIP to be
                      withdrawn — catching the case where a backend has unintentionally
                      dropped to zero replicas (a black hole).
                    - "Exempt": the Service is ignored (not counted), tolerating deliberate
                      scale-to-zero without withdrawing the VIP.

                  Selector-less Services (e.g. ExternalName or manually-managed endpoints)
                  are always exempt regardless of this setting. May be overridden
                  per-Gateway or per-Service with the "beacon.io/zero-replicas-policy"
                  annotation (Service > Gateway > this default).
                enum:
                - Unhealthy
                - Exempt
                type: string
            type: object
          status:
            description: GatewayHealthPolicyStatus defines the observed state of GatewayHealthPolicy.
            properties:
              advertisedIPs:
                description: |-
                  AdvertisedIPs is the number of Gateway IPs currently advertised via
                  MetalLB by Beacon.
                format: int32
                type: integer
              cluster:
                description: |-
                  Cluster identifies the cluster this Beacon instance is running on. See
                  ClusterIdentity for details; primarily useful for multi-cluster fleets
                  aggregating status from many Beacon instances.
                properties:
                  id:
                    description: |-
                      ID is a stable, unique cluster identifier suitable for cross-cluster
                      correlation. See ClusterIdentitySource for how it was determined.
                    type: string
                  name:
                    description: |-
                      Name is the effective human-readable cluster name: spec.clusterName if
                      set, else the OpenShift Infrastructure infrastructureName, else empty.
                    type: string
                  source:
                    description: Source records how ID was determined.
                    enum:
                    - OpenShiftClusterVersion
                    - KubeSystemUID
                    - Manual
                    type: string
                type: object
              conditions:
                description: |-
                  Conditions represent the latest available observations of the policy's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gateways:
                description: Gateways holds per-Gateway health and advertisement observations.
                items:
                  description: GatewayStatus captures the observed state of a single
                    managed Gateway.
                  properties:
                    advertisement:
                      description: |-
                        Advertisement is the current advertisement state Beacon is enforcing.
                          - "Advertised": IP(s) advertised in MetalLB.
                          - "Withdrawn": IP(s) withdrawn from MetalLB.
                          - "PendingWithdrawal": unhealthy, withdraw timer running.
                          - "PendingReadvertise": healthy again, re-advertise timer running.
                      type: string
                    fromMetalLB:
                      description: |-
                        FromMetalLB indicates whether the IPs are sourced from a MetalLB
                        IPAddressPool.
                      type: boolean
                    health:
                      description: |-
                        Health is the aggregate health of the Gateway's backing workloads.
                          - "Healthy": all probed pods are ready.
                          - "Unhealthy": at least one probed, non-exempt pod is failing.
                          - "Exempt": Gateway (or all its pods) are exempt from probing.
                          - "Unknown": health could not be determined.
                      type: string
                    ips:
                      description: IPs are the load-balancer IP addresses inferred
                        for this Gateway.
                      items:
                        type: string
                      type: array
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is when Health last changed. Used to evaluate the
                        dampening timers.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable explanation of the
                        current state.
                      type: string
                    name:
                      description: Name of the Gateway.
                      type: string
                    namespace:
                      description: Namespace of the Gateway.
                      type: string
                    timer:
                      description: |-
                        Timer describes a running dampening timer, if any. Published by the
                        active (leader) controller so all replicas' dashboards render it
                        consistently.
                      properties:
                        elapsedSeconds:
                          description: ElapsedSeconds is how long the condition has
                            persisted so far.
                          format: int64
                          type: integer
                        kind:
                          description: |-
                            Kind is "backoff" (backends unhealthy; counting down to withdraw) or
                            "recovery" (backends healthy again; counting down to re-advertise).
                          type: string
                        remainingSeconds:
                          description: RemainingSeconds is ThresholdSeconds-ElapsedSeconds
                            (never negative).
                          format: int64
                          type: integer
                        thresholdSeconds:
                          description: ThresholdSeconds is the configured duration
                            the condition must persist.
                          format: int64
                          type: integer
                      type: object
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              managedGateways:
                description: |-
                  ManagedGateways is the number of Gateways currently under management
                  (not exempt and matching the configured class filter).
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently
                  reconciled.
                format: int64
                type: integer
              withdrawnIPs:
                description: |-
                  WithdrawnIPs is the number of Gateway IPs currently withdrawn by Beacon
                  due to failing health probes.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
